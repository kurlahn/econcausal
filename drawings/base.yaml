name: base
data:
  n_variables: 12
  n_regimes: 5
  documents_per_regime: 40
  series_length: 600
  edge_density: 0.30
  signal_strength: 1.0
  noise_scale: 0.6
  decoy_rate: 0.35
  seed: 7
extraction:
  passes: 5
  vote_threshold: 0.4
  confidence_floor: 0.6
  dropout: 0.15
constraints:
  sign_restrictions: true
  temporal_precedence: true
  accounting_identities: true
prior:
  sources: [FOMC, ECB, NBER]
notears:
  l1_penalty: 0.1
  prior_penalty: 0.5
  learning_rate: 1.0
  outer_steps: 20
  inner_steps: 100
  rho_init: 1.0
  rho_max: 1.0e+16
  h_tolerance: 1.0e-8
  progress_rate: 0.25
backend:
  method: notears
  alpha: 0.05
  stringency: 10.0
  max_lag: 4
  prior_relaxation: 1.0
comparison:
  permutations: 200
  top_paths: 5
  instruments: [FEDFUNDS]
  targets: [CPIAUCSL, HOUST, PCE]
run:
  epochs: 6000
  batch_size: 64
  grad_accum: 96
  world_size: 8
  learning_rate: 2.0e-6
  warmup: 2000
  weight_decay: 0.0
  precision: fp32
  seeds: 20
  base_seed: 7
