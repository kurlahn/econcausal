extends: ../base.yaml
name: smoke
data:
  n_variables: 6
  n_regimes: 2
  documents_per_regime: 8
  series_length: 120
  edge_density: 0.4
  signal_strength: 1.2
  noise_scale: 0.5
  decoy_rate: 0.35
  seed: 1
notears:
  l1_penalty: 0.1
  prior_penalty: 0.5
