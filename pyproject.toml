[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econcausal"
version = "0.1.0"
description = "Text-prior hybrid causal discovery of macroeconomic transmission structure across regimes"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
  "torch==1.13.1",
  "numpy<2",
  "scipy>=1.7,<1.11",
  "PyYAML>=5.4,<7",
  "dacite>=1.6,<1.9",
  "click>=8.0,<9",
]

[project.optional-dependencies]
dev = ["ruff", "black", "isort", "mypy", "pytest"]

[project.scripts]
econcausal = "econcausal.helm.cli:main"

[tool.setuptools]
packages = [
  "econcausal",
  "econcausal.slipway",
  "econcausal.loft",
  "econcausal.frames",
  "econcausal.hull",
  "econcausal.rigging",
  "econcausal.sea_trials",
  "econcausal.drydock",
  "econcausal.blueprint",
  "econcausal.helm",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["econcausal"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP007", "UP006"]

[tool.ruff.lint.isort]
known-first-party = ["econcausal"]

[tool.mypy]
python_version = "3.10"
strict = true
disable_error_code = ["no-any-return", "no-untyped-call", "type-arg", "untyped-decorator"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["dacite", "yaml", "scipy", "scipy.*", "sklearn", "sklearn.*", "click"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["trials"]
addopts = "-q"
